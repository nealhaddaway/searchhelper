name: Generate Connect Cloud manifest

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.2'
          use-public-rspm: true

      - name: Install manifest tooling and app dependencies
        shell: bash
        run: |
          Rscript -e 'install.packages(c("rsconnect","shiny","bslib","DT","httr2","shinyjs","SnowballC"))'

      - name: Generate manifest.json
        shell: bash
        run: |
          Rscript -e 'rsconnect::writeManifest(appDir = ".")'
          test -s manifest.json

      - name: Commit generated manifest
        shell: bash
        run: |
          if git diff --quiet -- manifest.json && git ls-files --error-unmatch manifest.json >/dev/null 2>&1; then
            echo "manifest.json already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git commit -m "Generate Connect Cloud manifest"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
