name: Stage 4 concept search validation

on:
  push:
    branches:
      - stage4-concept-first
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Run all stage tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test-stage*.R; do
            echo "Running $test_file"
            Rscript "$test_file"
          done

      - name: Validate concept-first Lens query
        shell: bash
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        run: |
          if [ -z "$LENS_API_TOKEN" ]; then
            echo "LENS_API_TOKEN is not configured."
            exit 1
          fi

          cat > /tmp/lens-concept.json <<'JSON'
          {
            "query": {
              "query_string": {
                "query": "(salmon* OR \"rainbow trout\") AND (aquacultur* OR farm*)",
                "fields": ["title", "abstract", "keyword"],
                "default_operator": "and"
              }
            },
            "stemming": false,
            "size": 5,
            "sort": [{"relevance": "desc"}],
            "include": ["lens_id", "title", "abstract", "keywords", "external_ids"]
          }
          JSON

          status=$(curl --silent --show-error             --output /tmp/lens-concept-response.json             --write-out "%{http_code}"             --request POST "https://api.lens.org/scholarly/search"             --header "Authorization: Bearer $LENS_API_TOKEN"             --header "Content-Type: application/json"             --data-binary @/tmp/lens-concept.json)

          if [ "$status" != "200" ]; then
            echo "Concept-first Lens query failed with HTTP $status."
            python3 - <<'PY'
          import json
          try:
              with open("/tmp/lens-concept-response.json", encoding="utf-8") as f:
                  data=json.load(f)
              print({k:data.get(k) for k in ("error","message","status") if k in data})
          except Exception:
              print("Lens returned a non-JSON error response.")
          PY
            exit 1
          fi

          python3 - <<'PY'
          import json
          with open("/tmp/lens-concept-response.json", encoding="utf-8") as f:
              data=json.load(f)
          rows=data.get("data") or []
          if not rows:
              raise SystemExit("Lens concept query returned HTTP 200 but no records.")
          if not rows[0].get("lens_id"):
              raise SystemExit("Lens concept result is missing lens_id.")
          print(f"Concept-first Lens query passed with {len(rows)} returned records.")
          PY
