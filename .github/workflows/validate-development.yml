name: Validate development branches

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Run stage tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test-stage*.R; do
            echo "Running $test_file"
            Rscript "$test_file"
          done

      - name: Check Lens API secret
        shell: bash
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        run: |
          if [ -z "$LENS_API_TOKEN" ]; then
            echo "LENS_API_TOKEN is not configured for this repository."
            exit 1
          fi

      - name: Lens scholarly API smoke test
        shell: bash
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        run: |
          cat > /tmp/lens-request.json <<'JSON'
          {
            "query": {
              "match": {
                "doi": "10.1109/ee.1934.6540358"
              }
            },
            "include": ["lens_id", "title", "references", "scholarly_citations"],
            "size": 1
          }
          JSON

          status=$(curl --silent --show-error             --output /tmp/lens-response.json             --write-out "%{http_code}"             --request POST "https://api.lens.org/scholarly/search"             --header "Authorization: Bearer $LENS_API_TOKEN"             --header "Content-Type: application/json"             --data-binary @/tmp/lens-request.json)

          if [ "$status" != "200" ]; then
            echo "Lens API smoke test failed with HTTP $status."
            python3 - <<'PY'
          import json
          try:
              with open("/tmp/lens-response.json", "r", encoding="utf-8") as f:
                  data = json.load(f)
              print({k: data.get(k) for k in ("error", "message", "status") if k in data})
          except Exception:
              print("Lens returned a non-JSON error response.")
          PY
            exit 1
          fi

          python3 - <<'PY'
          import json
          with open("/tmp/lens-response.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          records = data.get("data") or []
          if not records:
              raise SystemExit("Lens API returned HTTP 200 but no scholarly record.")
          print("Lens API smoke test passed.")
          PY


      - name: Lens ranked-search helper smoke test
        shell: bash
        env:
          LENS_API_TOKEN: ${{ secrets.LENS_API_TOKEN }}
        run: |
          Rscript - <<'RS'
          if (!requireNamespace("httr2", quietly = TRUE)) install.packages("httr2")
          source("R/boolean_match.R")
          source("R/lens_api.R")
          token <- Sys.getenv("LENS_API_TOKEN")
          x <- lens_ranked_search(
            '(salmon* OR "rainbow trout") AND (aquacultur* OR farm*)',
            token,
            size = 5L
          )
          stopifnot(nrow(x) > 0L)
          stopifnot(all(c("rank", "lens_id", "title") %in% names(x)))
          cat(sprintf("Ranked helper passed with %d records.\n", nrow(x)))
          RS
